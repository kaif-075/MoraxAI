<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAssist AI Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Segoe UI, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      overflow:hidden;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at top left, rgba(255,255,255,.08), transparent 35%),
      radial-gradient(circle at bottom right, rgba(255,255,255,.06), transparent 35%);
      pointer-events:none;
    }
    .table-wrapper{
    overflow-x:auto;
}

    .login-box{
      width:400px;
      padding:40px 35px;
      border-radius:24px;
      background:rgba(160,160,160,.12);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 10px 40px rgba(0,0,0,.5);
      position:relative;
      z-index:1;
    }

    .brand{
      color:white;
      font-size:30px;
      font-weight:600;
      text-align:center;
      margin-bottom:8px;
    }

    .subtitle{
      color:#bdbdbd;
      text-align:center;
      font-size:14px;
      margin-bottom:35px;
    }

    .input-group{
      margin-bottom:22px;
    }

    .input-group label{
      display:block;
      color:#d8d8d8;
      margin-bottom:8px;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:15px 18px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,.08);
      color:white;
      font-size:15px;
    }

    .input-group input::placeholder{
      color:#8e8e8e;
    }

    .login-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      margin-top:10px;
      transition:.25s ease;
    }

    .login-btn:hover{
      transform:translateY(-2px);
    }

    .footer-text{
      color:#9a9a9a;
      font-size:15px;
      text-align:center;
      margin-top:24px;

    }

    @media(max-width:500px){
      .login-box{
        width:92%;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">

    <div class="brand">Morax AI</div>
    <div class="subtitle">Your Academic Companion</div>

    <form>

      <div class="input-group">
        <label>PIN Number*</label>
        <input type="text" id="pin" placeholder="Enter your PIN" required/>
      </div>

      <div class="input-group">
        <label>Password*</label>
        <input type="password" id="password" placeholder="Enter your password" required/>
      </div>

      <button class="login-btn" type="button" onclick="loginStudent()">
        Login
      </button>

    </form>

    <div class="footer-text">
      Secure Student Authentication<br>
      <!-- &hearts;Team Morax&hearts; -->
    </div>

  </div>
<script>
    async function loginStudent(){
      const pin = document.getElementById('pin').value;
      const password = document.getElementById('password').value;
      const response = await fetch("http://127.0.0.1:5000/login",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        credentials:"include",
        body:JSON.stringify({
          pin: pin,
          password: password
        })
      });
      const data = await response.json();
      console.log(data);
      if(data.success){
        window.location.href="project_sem.html";
      }
      else{
        alert(data.message);
      }
    }
</script>
</body>
</html>
